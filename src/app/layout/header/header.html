<div class="header">
  <h2>{{ boardName() | titlecase }}</h2>
  <div>
    <button (click)="isAddNewTaskClicked.set(!isAddNewTaskClicked())">+ add new task</button>
    <img src="icon-vertical-ellipsis.svg" alt="Add">
  </div>

</div>
@if (isAddNewTaskClicked()) {
  <app-add-new-task-card (close)="isAddNewTaskClicked.set(false)"></app-add-new-task-card>
}
